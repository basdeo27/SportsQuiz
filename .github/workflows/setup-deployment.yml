name: Configure deployment infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-quiz-production
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-west-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME || secrets.LIGHTSAIL_SERVICE_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL || secrets.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assume infrastructure role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sports-quiz-setup-${{ github.run_id }}
      - name: Configure ECR access and CloudFront API routing
        run: python3 scripts/setup_deployment.py
