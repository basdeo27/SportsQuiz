spring:
  application:
    name: Sports-Quiz
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: never

rate-limit:
  ai:
    enabled: true
    capacity: 5           # burst allowance
    refill-per-minute: 5  # sustained rate (tokens/min per IP)
  auth:
    enabled: true
    capacity: 10
    refill-per-minute: 10
  quiz-write:
    enabled: true
    capacity: 30
    refill-per-minute: 30
  read:
    enabled: true
    capacity: 60
    refill-per-minute: 60

ai:
  mistral:
    api-key: ${MISTRAL_API_KEY:}
    model: mistral-small-latest

quiz:
  monitoring:
    api-key: ${MONITORING_API_KEY:}
  daily:
    attempts:
      login-required: ${DAILY_LOGIN_REQUIRED:false}
    leaderboard:
      table-name: sports-quiz-daily-scores
      page-size: ${DAILY_LEADERBOARD_PAGE_SIZE:50}
      max-page-size: 100
      zone: Europe/London
  storage: ${QUIZ_STORAGE:dynamo}
  cors:
    allowed-origins:
      - https://d2323rgqey2wlv.cloudfront.net
      - https://funsportsquiz.com
      - http://localhost:5173
  questions:
    storage: local
  settings:
    min-questions: 1
    max-questions: 25
    disabled-logo-leagues: []
    disabled-face-leagues: []
  dynamo:
    endpoint: "https://dynamodb.eu-west-2.amazonaws.com"
    region: eu-west-2
    teams-table-name: sports-quiz-teams
    results-table-name: sports-quiz-results
    seed: false
    access-key: ${AWS_DYNAMO_ACCESS_KEY_ID:}
    secret-key: ${AWS_DYNAMO_SECRET_ACCESS_KEY:}
